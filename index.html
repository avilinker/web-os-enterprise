<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Web OS 3D - Multiplayer World</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <!-- טעינת ספריית Three.js לפיתוח תלת ממד -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; height: 100vh; overflow: hidden; }

        /* מסך כניסה */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-box {
            background: #1e293b; padding: 40px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 360px; text-align: center;
            border: 1px solid #334155;
        }
        .login-box h2 { margin-bottom: 20px; color: #38bdf8; }
        .login-box input {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px;
            border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px;
        }
        .login-box button {
            width: 100%; padding: 12px; background: #38bdf8; border: none;
            color: #0f172a; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px;
        }

        /* קנבס המשחק התלת ממדי */
        #game-container { display: none; width: 100vw; height: 100vh; position: relative; }
        
        /* ממשק משתמש על גבי המסך */
        .hud {
            position: absolute; top: 20px; right: 20px; background: rgba(15, 23, 42, 0.85);
            padding: 15px; border-radius: 8px; border: 1px solid #334155; pointer-events: none;
        }
        .hud h3 { color: #38bdf8; margin-bottom: 5px; }
    </style>
</head>
<body>

    <!-- מסך התחברות למשחק -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Web OS 3D World</h2>
            <input type="text" id="username-input" placeholder="הכנס את הכינוי שלך...">
            <button onclick="startGame()">היכנס לעולם ה-3D</button>
        </div>
    </div>

    <!-- מרחב המשחק -->
    <div id="game-container">
        <div class="hud">
            <h3 id="hud-name">שחקן</h3>
            <p>השתמש במקשים <b>W, A, S, D</b> כדי לזוז במרחב.</p>
        </div>
    </div>

    <script>
        const socket = io();
        let username = '';
        let scene, camera, renderer, playerMesh;
        let otherPlayers = {};
        let keys = { w: false, a: false, s: false, d: false };
        let playerPos = { x: 0, y: 1, z: 0 };

        function startGame() {
            username = document.getElementById('username-input').value.trim();
            if (!username) { alert('נא להזין כינוי תקין'); return; }

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            document.getElementById('hud-name').innerText = `שחקן: ${username}`;

            init3DWorld();
            socket.emit('join_game', { username });
        }

        function init3DWorld() {
            // יצירת סצנת תלת ממד
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.05);

            // מצלמה
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            // רינדור
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            // תאורה
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);

            // רצפת גריד רשת עתידנית
            const gridHelper = new THREE.GridHelper(50, 50, 0x38bdf8, 0x334155);
            scene.add(gridHelper);

            // יצירת האוואטר של השחקן המקומי (קוביה תלת-ממדית זוהרת)
            const geometry = new THREE.BoxGeometry(1, 2, 1);
            const material = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.3 });
            playerMesh = new THREE.Mesh(geometry, material);
            playerMesh.position.set(0, 1, 0);
            scene.add(playerMesh);

            // האזנה למקשי מקלדת
            window.addEventListener('keydown', (e) => updateKeys(e, true));
            window.addEventListener('keyup', (e) => updateKeys(e, false));

            // לופ אנימציה ראשי
            animate();
        }

            function updateKeys(e, isDown) {
            switch(e.key.toLowerCase()) {
                case 'w': keys.w = isDown; break;
                case 'a': keys.a = isDown; break;
                case 's': keys.s = isDown; break;
                case 'd': keys.d = isDown; break;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // תזוזת השחקן המקומי
            let speed = 0.1;
            if (keys.w) playerPos.z -= speed;
            if (keys.s) playerPos.z += speed;
            if (keys.a) playerPos.x -= speed;
            if (keys.d) playerPos.x += speed;

            playerMesh.position.set(playerPos.x, playerPos.y, playerPos.z);
            
            // הצמדת המצלמה לשחקן מאחורה ומלמעלה
            camera.position.set(playerPos.x, playerPos.y + 4, playerPos.z + 8);
            camera.lookAt(playerMesh.position);

            // שליחת המיקום לשרת בלייב
            socket.emit('player_move', playerPos);

            renderer.render(scene, camera);
        }

        // עדכון שחקנים אחרים בעולם ה-3D
        socket.on('update_players', function(players) {
            for (let id in players) {
                if (id === socket.id) continue;
                let pData = players[id];

                if (!otherPlayers[id]) {
                    // יצירת אוואטר לשחקן אחר (בצבע אדום)
                    const geom = new THREE.BoxGeometry(1, 2, 1);
                    const mat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
                    const mesh = new THREE.Mesh(geom, mat);
                    scene.add(mesh);
                    otherPlayers[id] = mesh;
                }
                otherPlayers[id].position.set(pData.x, pData.y, pData.z);
            }

            // מחיקת שחקנים שהתנתקו
            for (let id in otherPlayers) {
                if (!players[id]) {
                    scene.remove(otherPlayers[id]);
                    delete otherPlayers[id];
                }
            }
        });
    </script>
</body>
</html>
