<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Web OS Enterprise - Ultimate Fleet</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-box {
            background: #1e293b; padding: 40px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 360px; text-align: center;
            border: 1px solid #334155;
        }
        .login-box h2 { margin-bottom: 20px; color: #38bdf8; }
        .login-box input {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px;
            border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px;
        }
        .login-box button {
            width: 100%; padding: 12px; background: #38bdf8; border: none;
            color: #0f172a; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px;
        }

        #desktop { display: none; flex: 1; position: relative; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); padding: 20px; overflow: hidden; }
        
        .window {
            position: absolute; background: #1e293b; border: 1px solid #475569;
            border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; min-width: 340px; width: 440px; height: 380px;
            resize: both; overflow: hidden;
        }
        .window-header {
            background: #334155; padding: 10px 15px; display: flex; justify-content: space-between;
            align-items: center; cursor: move; user-select: none; font-weight: bold; color: #38bdf8;
        }
        .window-controls span { cursor: pointer; padding: 0 6px; font-size: 14px; color: #94a3b8; }
        .window-body { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .metric-card { background: #0f172a; padding: 8px; border-radius: 6px; border: 1px solid #334155; text-align: center; }
        .metric-value { font-size: 18px; font-weight: bold; color: #34d399; margin-top: 3px; }

        .terminal {
            background: #000; color: #00ff00; font-family: 'Courier New', Courier, monospace;
            padding: 8px; border-radius: 6px; flex: 1; overflow-y: auto; font-size: 13px;
            display: flex; flex-direction: column;
        }
        .terminal-output { flex: 1; white-space: pre-wrap; margin-bottom: 5px; }
        .terminal-input-line { display: flex; align-items: center; gap: 5px; }
        .terminal-input-line span { color: #38bdf8; }
        .terminal-input-line input {
            background: transparent; border: none; color: #fff; outline: none; flex: 1; font-family: monospace; font-size: 13px;
        }

        .process-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 6px 10px; border-radius: 4px; border: 1px solid #334155; font-size: 13px; margin-bottom: 5px; }
        .kill-btn { background: #ef4444; color: white; border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }

        #taskbar {
            height: 50px; background: rgba(15, 23, 42, 0.95); border-top: 1px solid #334155;
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 999;
        }
        .start-btn { background: #38bdf8; color: #0f172a; border: none; padding: 8px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .status-info { font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>Web OS Enterprise</h2>
            <input type="text" id="username-input" placeholder="שם משתמש (למשל: avi)">
            <input type="password" id="password-input" placeholder="סיסמה (אם מנהל)">
            <button onclick="login()">התחבר למערכת</button>
        </div>
    </div>

    <div id="desktop">
        <!-- Fleet & Live Metrics Window -->
        <div class="window" id="win-fleet" style="top: 20px; left: 20px;">
            <div class="window-header">
                <span>🖥️ ניהול חומרה ומדדים חיים</span>
                <div class="window-controls"><span onclick="toggleWindow('win-fleet')">_</span><span>□</span><span onclick="toggleWindow('win-fleet')">×</span></div>
            </div>
            <div class="window-body">
                <div class="metrics-grid">
                    <div class="metric-card"><div>CPU Usage</div><div class="metric-value" id="cpu-val">--%</div></div>
                    <div class="metric-card"><div>RAM Usage</div><div class="metric-value" id="ram-val">--%</div></div>
                </div>
                <h4 style="color: #38bdf8; font-size: 14px;">תחנות פעילות ברשת:</h4>
                <div id="fleet-list" style="background: #0f172a; padding: 8px; border-radius: 6px; border: 1px solid #334155; flex: 1; overflow-y: auto; font-size: 13px;">טוען...</div>
            </div>
        </div>

        <!-- Terminal Window -->
        <div class="window" id="win-terminal" style="top: 20px; left: 480px; width: 460px; height: 380px;">
            <div class="window-header">
                <span>💻 מסוף טרמינל מבודד</span>
                <div class="window-controls"><span onclick="toggleWindow('win-terminal')">_</span><span>□</span><span onclick="toggleWindow('win-terminal')">×</span></div>
            </div>
            <div class="window-body" style="background: #000;">
                <div class="terminal">
                    <div class="terminal-output" id="term-output">טרמינל פעיל. הקלד 'help' או 'ps'.\n</div>
                    <div class="terminal-input-line">
                        <span id="term-prompt">user@os:~$</span>
                        <input type="text" id="term-input" onkeydown="handleTerminalKey(event)">
                    </div>
                </div>
            </div>
        </div>

        <!-- Task Manager Window -->
        <div class="window" id="win-tasks" style="top: 240px; left: 20px; width: 440px; height: 260px;">
            <div class="window-header">
                <span>📊 מנהל תהליכים (Task Manager)</span>
                <div class="window-controls"><span onclick="toggleWindow('win-tasks')">_</span><span>□</span><span onclick="toggleWindow('win-tasks')">×</span></div>
            </div>
            <div class="window-body">
                <div id="process-list" style="flex: 1; overflow-y: auto;">טוען תהליכים...</div>
            </div>
        </div>
    </div>

    <div id="taskbar">
        <button class="start-btn" onclick="alert('Web OS Ultimate Engine Active')">start ❖</button>
        <div class="status-info" id="user-status-bar">מחובר כמערכת</div>
    </div>

    <script>
        const socket = io();
        let currentUser = '', currentRole = '', currentPcId = '';

        function login() {
            const username = document.getElementById('username-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            if (!username) { alert('נא להזין שם משתמש'); return; }

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    currentUser = username;
                    currentRole = data.role;
                    currentPcId = data.pc_id || username;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('desktop').style.display = 'block';
                    document.getElementById('user-status-bar').innerText = `מחובר: ${username} (${currentRole})`;
                    socket.emit('join_pc_room', { pc_id: currentPcId });
                    loadFleetData();
                } else { alert(data.error); }
            });
        }

        function loadFleetData() {
            fetch('/api/admin/all_computers')
            .then(res => res.json())
            .then(data => updateFleetUI(data));
        }

        function updateFleetUI(fleet) {
            const list = document.getElementById('fleet-list');
            list.innerHTML = '';
            const procContainer = document.getElementById('process-list');
            procContainer.innerHTML = '';

            for (let [pcId, info] of Object.entries(fleet)) {
                if (pcId === currentPcId || currentRole === 'admin') {
                    if (info.cpu !== undefined) {
                        document.getElementById('cpu-val').innerText = info.cpu + '%';
                        document.getElementById('ram-val').innerText = info.ram + '%';
                    }
                    if (pcId === currentPcId && info.processes) {
                        info.processes.forEach(p => {
                            procContainer.innerHTML += `<div class="process-item"><span><b>[${p.pid}]</b> ${p.name} (${p.cpu}%)</span> <button class="kill-btn" onclick="killProc(${p.pid})">Kill</button></div>`;
                        });
                    }
                }
                const div = document.createElement('div');
                div.style.padding = '6px';
                div.style.borderBottom = '1px solid #1e293b';
                div.innerHTML = `<b>${pcId}</b> (${info.owner}) - <span style="color:#34d399">${info.status}</span><br><small>CPU: ${info.cpu}% | פעילות: ${info.last_activity}</small>`;
                list.appendChild(div);
            }
        }

        function killProc(pid) {
            fetch('/api/computer/kill_process', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pc_id: currentPcId, pid: pid })
            }).then(res => res.json()).then(data => loadFleetData());
        }

        function handleTerminalKey(event) {
            if (event.key === 'Enter') {
                const input = document.getElementById('term-input');
                const cmd = input.value.trim();
                if (!cmd) return;
                const outputDiv = document.getElementById('term-output');
                outputDiv.innerText += `\nuser@${currentPcId}:~$ ${cmd}\n`;

                if (cmd.toLowerCase() === 'clear') {
                    outputDiv.innerText = '';
                    input.value = '';
                    return;
                }

                fetch('/api/computer/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pc_id: currentPcId, command: cmd })
                })
                .then(res => res.json())
                .then(data => {
                    outputDiv.innerText += data.output + '\n';
                    outputDiv.scrollTop = outputDiv.scrollHeight;
                    loadFleetData();
                });
                input.value = '';
            }
        }

        function toggleWindow(winId) {
            const win = document.getElementById(winId);
            win.style.display = win.style.display === 'none' ? 'flex' : 'none';
        }

        socket.on('fleet_updated', function(fleet) { updateFleetUI(fleet); });

        // Draggable Windows Logic
        document.querySelectorAll('.window').forEach(win => {
            const header = win.querySelector('.window-header');
            let isDragging = false, startX, startY, initialLeft, initialTop;
            header.addEventListener('mousedown', (e) => {
                isDragging = true; startX = e.clientX; startY = e.clientY;
                initialLeft = win.offsetLeft; initialTop = win.offsetTop;
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                win.style.left = (initialLeft + e.clientX - startX) + 'px';
                win.style.top = (initialTop + e.clientY - startY) + 'px';
            });
            document.addEventListener('mouseup', () => { isDragging = false; });
        });
    </script>
</body>
</html>
