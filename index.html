<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CS: ISRAELI TACTICAL STRIKE 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- טעינת GLTFLoader מובנה מתוך CDN לטעינת מודלים תלת-ממדיים ריאליסטיים -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #020617; color: #f8fafc; height: 100vh; overflow: hidden; }

        #menu-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1e293b 0%, #020617 100%);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .menu-box {
            background: #0f172a; padding: 40px; border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9); width: 440px; text-align: center;
            border: 1px solid #334155;
        }
        .menu-box h1 { color: #38bdf8; margin-bottom: 8px; font-size: 22px; letter-spacing: 1px; }
        .menu-box p { color: #94a3b8; font-size: 13px; margin-bottom: 25px; }
        .menu-box input, .menu-box select {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px;
            border: 1px solid #475569; background: #1e293b; color: #fff; font-size: 15px; text-align: center;
        }
        .menu-btn {
            width: 100%; padding: 14px; background: #0284c7; border: none; color: #fff;
            font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; font-size: 15px; margin-top: 10px;
        }
        .menu-btn:hover { background: #38bdf8; color: #0f172a; }

        #game-container { display: none; width: 100vw; height: 100vh; position: relative; cursor: crosshair; }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
            transform: translate(-50%, -50%); pointer-events: none;
            border: 2px solid rgba(56, 189, 248, 0.95); border-radius: 50%;
        }
        #crosshair::after {
            content: ''; position: absolute; top: 6px; left: 6px; width: 2px; height: 2px; background: #ef4444;
        }

        .hud-top {
            position: absolute; top: 20px; left: 20px; background: rgba(15, 23, 42, 0.95);
            padding: 15px 22px; border-radius: 8px; border: 1px solid #334155; pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7); min-width: 260px;
        }
        .hud-top h3 { color: #38bdf8; margin-bottom: 6px; font-size: 17px; }
        .hud-top p { font-size: 14px; color: #cbd5e1; margin-bottom: 3px; }

        .hud-bottom-right {
            position: absolute; bottom: 25px; right: 25px; background: rgba(15, 23, 42, 0.95);
            padding: 15px 25px; border-radius: 8px; border: 1px solid #334155; pointer-events: none;
            font-family: monospace; font-size: 22px; color: #34d399; letter-spacing: 2px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
        }
        .health-bar-container {
            width: 100%; background: #334155; height: 8px; border-radius: 4px; margin-top: 6px; overflow: hidden;
        }
        .health-bar-fill {
            width: 100%; background: #22c55e; height: 100%; transition: width 0.2s;
        }
    </style>
</head>
<body>

    <div id="menu-screen">
        <div class="menu-box">
            <h1>🇮🇱 ISRAELI TACTICAL STRIKE 3D</h1>
            <p>מערכת קרב מתקדמת עם מודלים תלת-ממדיים</p>
            <input type="text" id="username-input" placeholder="שם הלוחם (למשל: אבי)..." value="אבי">
            
            <label style="font-size: 13px; color: #94a3b8; display: block; text-align: right; margin-bottom: 5px;">בחר כוח מבצעי:</label>
            <select id="team-select">
                <option value="idf">🛡️ ימ"מ / צה"ל (כוחות הביטחון)</option>
                <option value="terrorist">⚡ חוליית מחבלים עוינת</option>
            </select>

            <label style="font-size: 13px; color: #94a3b8; display: block; text-align: right; margin-bottom: 5px;">בחר נשק ראשי:</label>
            <select id="weapon-select">
                <option value="M16">רובה סער מתקדם M16</option>
                <option value="AK47">קלצ'ניקוב AK-47</option>
                <option value="RPG">מטול RPG כבד</option>
            </select>

            <button class="menu-btn" onclick="joinGame()">🎮 התחל במבצע</button>
        </div>
    </div>

    <div id="game-container">
        <div id="crosshair"></div>
        <div class="hud-top">
            <h3 id="hud-name">לוחם</h3>
            <p>יחידה: <span id="hud-team" style="color: #38bdf8;">צה"ל</span></p>
            <p>חיסולים: <span id="hud-score" style="color: #34d399;">0</span></p>
            <p style="margin-top: 6px;">מד חיים (HP):</p>
            <div class="health-bar-container">
                <div class="health-bar-fill" id="hp-bar"></div>
            </div>
        </div>
        <div class="hud-bottom-right" id="hud-weapon">M16 | <span id="ammo-count">30</span>/30</div>
    </div>

    <script>
        const socket = io();
        let username = '', team = 'idf', weapon = 'M16';
        let scene, camera, renderer, playerGroup;
        let activePlayers = {}, activeBots = {};
        let keys = { w: false, a: false, s: false, d: false, left: false, right: false };
        let playerPos = { x: 0, y: 0, z: 0, rot: 0, health: 100 };
        let bullets = [];
        let currentAmmo = 30;
        let gltfLoader = new THREE.GLTFLoader();

        function joinGame() {
            username = document.getElementById('username-input').value.trim();
            if (!username) { alert('נא להזין שם לוחם'); return; }
            team = document.getElementById('team-select').value;
            weapon = document.getElementById('weapon-select').value;

            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            document.getElementById('hud-name').innerText = `לוחם: ${username}`;
            document.getElementById('hud-team').innerText = team === 'idf' ? '🛡️ ימ"מ / צה"ל' : '⚡ חוליית טרור';
            document.getElementById('hud-weapon').innerHTML = `${weapon} | <span id="ammo-count">${currentAmmo}</span>/30`;

            init3DWorld();
            socket.emit('join_game', { username, team, weapon });
        }

        // פונקציית יצירת דמות ריאליסטית עם טעינת מודל GLTF חיצוני עם גיבוי מבני
        function createOperatorModel(teamType, weaponType) {
            const group = new THREE.Group();

            // מודל גיבוי גיאומטרי מורכב וריאליסטי למקרה שהטעינה מהרשת תתעכב
            let uniformColor = teamType === 'idf' ? 0x1d4ed8 : 0x9a3412;
            
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(0.7, 1.0, 0.4),
                new THREE.MeshStandardMaterial({ color: uniformColor, roughness: 0.3 })
            );
            body.position.y = 1.0;
            group.add(body);

            const helmet = new THREE.Mesh(
                new THREE.SphereGeometry(0.25, 16, 16),
                new THREE.MeshStandardMaterial({ color: teamType === 'idf' ? 0x334155 : 0x18181b, metalness: 0.6 })
            );
            helmet.position.y = 1.7;
            group.add(helmet);

            let gunGeo = new THREE.BoxGeometry(0.1, 0.1, 1.2);
            if (weaponType === 'RPG') gunGeo = new THREE.CylinderGeometry(0.12, 0.12, 2.0, 8);
            const gun = new THREE.Mesh(gunGeo, new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.8 }));
            gun.position.set(0.35, 1.0, -0.6);
            group.add(gun);

            // ניסיון טעינת מודל תלת-ממדי אמיתי משרת ציבורי (CesiumMan GLB)
            gltfLoader.load(
                'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMan/glTF-Binary/CesiumMan.glb',
                function (gltf) {
                    const model = gltf.scene;
                    model.scale.set(1.2, 1.2, 1.2);
                    model.position.set(0, 0, 0);
                    group.add(model);
                },
                undefined,
                function (error) {
                    console.log('Using procedural tactical model fallback');
                }
            );

            return group;
        }

        function init3DWorld() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617);
            scene.fog = new THREE.FogExp2(0x020617, 0.02);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            // תאורת זירה עשירה
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
            dirLight.position.set(30, 60, 30);
            scene.add(dirLight);

            // רצפה
            scene.add(new THREE.GridHelper(160, 80, 0x0284c7, 0x1e293b));

            // מחסות בזירה
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 });
            for (let i = -4; i <= 4; i++) {
                const bunker = new THREE.Mesh(new THREE.BoxGeometry(6, 2.5, 2.0), wallMat);
                bunker.position.set(i * 16, 1.25, -22);
                scene.add(bunker);
            }

            // יצירת השחקן המקומי
            playerGroup = createOperatorModel(team, weapon);
            scene.add(playerGroup);

            // אירועי מקלדת ועכבר
            window.addEventListener('keydown', (e) => setKey(e, true));
            window.addEventListener('keyup', (e) => setKey(e, false));
            window.addEventListener('mousedown', () => fireWeapon());

            animate();
        }

        function setKey(e, isDown) {
            switch(e.key.toLowerCase()) {
                case 'w': keys.w = isDown; break;
                case 'a': keys.a = isDown; break;
                case 's': keys.s = isDown; break;
                case 'd': keys.d = isDown; break;
                case 'arrowleft': keys.left = isDown; break;
                case 'arrowright': keys.right = isDown; break;
            }
        }

        function fireWeapon() {
            if (currentAmmo <= 0) currentAmmo = 30;
            currentAmmo--;
            document.getElementById('ammo-count').innerText = currentAmmo;

            // יצירת קליע זוהר
            const bulletMesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.12, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xfacc15 })
            );
            
            let angle = playerPos.rot;
            bulletMesh.position.set(
                playerGroup.position.x - Math.sin(angle) * 1.8,
                playerGroup.position.y + 1.2,
                playerGroup.position.z - Math.cos(angle) * 1.8
            );
            scene.add(bulletMesh);

            bullets.push({
                mesh: bulletMesh,
                dirX: -Math.sin(angle),
                dirZ: -Math.cos(angle),
                life: 50
            });

            // בדיקת פגיעה בבוטים
            for (let botId in activeBots) {
                let bMesh = activeBots[botId];
                let dist = playerGroup.position.distanceTo(bMesh.position);
                if (dist < 22) {
                    socket.emit('player_shoot', { target_id: botId });
                    break;
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            let speed = 0.15;
            let rotSpeed = 0.045;

            if (keys.left) playerPos.rot += rotSpeed;
            if (keys.right) playerPos.rot -= rotSpeed;

            let angle = playerPos.rot;
            if (keys.w) {
                playerPos.x -= Math.sin(angle) * speed;
                playerPos.z -= Math.cos(angle) * speed;
            }
            if (keys.s) {
                playerPos.x += Math.sin(angle) * speed;
                playerPos.z += Math.cos(angle) * speed;
            }
            if (keys.a) {
                playerPos.x -= Math.cos(angle) * speed;
                playerPos.z += Math.sin(angle) * speed;
            }
            if (keys.d) {
                playerPos.x += Math.cos(angle) * speed;
                playerPos.z -= Math.sin(angle) * speed;
            }

            playerGroup.position.set(playerPos.x, playerPos.y, playerPos.z);
            playerGroup.rotation.y = playerPos.rot;

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.mesh.position.x += b.dirX * 1.4;
                b.mesh.position.z += b.dirZ * 1.4;
                b.life--;
                if (b.life <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            // מצלמת גוף שלישי טקטית
            let camX = playerPos.x + Math.sin(angle) * 8.5;
            let camZ = playerPos.z + Math.cos(angle) * 8.5;
            camera.position.set(camX, playerPos.y + 4.5, camZ);
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.4, playerGroup.position.z);

            socket.emit('player_move', playerPos);
            renderer.render(scene, camera);
        }

        socket.on('update_game_state', function(data) {
            let players = data.players;
            let bots = data.bots;

            for (let id in players) {
                if (id === socket.id) {
                    let p = players[id];
                    document.getElementById('hud-score').innerText = p.score || 0;
                    document.getElementById('hp-bar').style.width = (p.health || 100) + '%';
                    continue;
                }
                let p = players[id];
                if (!activePlayers[id]) {
                    const mesh = createOperatorModel(p.team, p.weapon);
                    scene.add(mesh);
                    activePlayers[id] = mesh;
                }
                activePlayers[id].position.set(p.x, p.y, p.z);
                activePlayers[id].rotation.y = p.rot;
            }

            for (let id in bots) {
                let b = bots[id];
                if (!activeBots[id]) {
                    const botMesh = createOperatorModel('terrorist', 'AK47');
                    scene.add(botMesh);
                    activeBots[id] = botMesh;
                }
                activeBots[id].position.set(b.x, b.y, b.z);
                activeBots[id].rotation.y = b.rot;
            }
        });
    </script>
</body>
</html>
